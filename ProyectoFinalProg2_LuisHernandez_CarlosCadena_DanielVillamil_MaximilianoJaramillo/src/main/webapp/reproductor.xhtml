<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<title>Reproductor de Audio</title>
	<style>
body {
	font-family: Arial, sans-serif;
	background-image:
		url(https://img.freepik.com/vector-gratis/fondos-negros-degradados-marcos-dorados_79603-2209.jpg);
	background-repeat: no-repeat;
	background-size: cover;
	color: white;
	margin: 0;
	padding: 0;
	display: flex;
	justify-content: center;
	align-items: center;
	height: 100vh;
}

.menu {
	background-color: rgba(0, 0, 0, 0.7);
	padding: 10px;
	display: flex;
	justify-content: space-between;
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	z-index: 1000;
	/* Asegura que el menú aparezca por encima del resto del contenido */
}

.menu-item {
	color: #c1b575;
	text-decoration: none;
	margin: 0 10px;
}

.menu-item:hover {
	text-decoration: underline;
}

/* Estilo para el enlace del "Reproductor" cuando está activo */
.menu-item.active {
	text-decoration: underline;
}

.container {
	display: flex;
	width: 80%;
	margin-top: 60px;
	/* Ajusta el margen superior para dar espacio al menú fijo */
}

.left-column {
	flex: 1;
	padding: 20px;
}

.right-column {
	flex: 1;
	padding: 20px;
	border: 1px solid #ccc;
	border-radius: 5px;
	background-color: rgba(0, 0, 0, 0.7);
	box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
	text-align: center;
}

h5 {
	margin-top: 0;
}

.audio-controls {
	display: flex;
	align-items: center;
	justify-content: center;
	margin-top: 20px;
}

.audio-url-input {
	width: 60%;
	padding: 10px;
	font-size: 14px;
}

.play-button {
	margin-left: 10px;
	font-size: 16px;
}

a {
	color: #c1b575;
	text-decoration: none;
}

a:hover {
	text-decoration: underline;
}

.left-column {
	flex: 1;
	padding: 20px;
	border: 1px solid #ccc;
	border-radius: 5px;
	background-color: rgba(0, 0, 0, 0.7);
	box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
	text-align: center;
	overflow-y: auto;
	max-height: 400px;
}

ul#cancionesList {
	list-style: none;
	padding: 0;
}

ul#cancionesList li {
	margin-bottom: 10px;
}

ul#cancionesList li a {
	color: #c1b575;
	text-decoration: none;
	display: block;
	padding: 8px 0;
	border-bottom: 1px solid #555;
}

ul#cancionesList li a:hover {
	text-decoration: underline;
}

.container {
	display: flex;
	width: 80%;
	margin-top: 20px;
	justify-content: center;
}

.right-column {
	flex: 1;
	padding: 20px;
	border: 1px solid #ccc;
	border-radius: 5px;
	background-color: rgba(0, 0, 0, 0.7);
	box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
	text-align: center;
	color: white;
}
</style>
</h:head>
<h:body>
	<div class="menu">
		<a href="#" class="menu-item">Reproductor</a>
		<h:link value="Crear Canción" outcome="canciones.xhtml"
			class="menu-item" />
	</div>
	<div class="container">
		<div class="left-column">
			<h3>Listado de Canciones</h3>
			<ul id="cancionesList">
				<ui:repeat value="#{cancionBean.listarCanciones()}" var="cancion">
					<li><a href="#"
						onclick="seleccionarCancion('#{cancion.url_Cancion}')">
							#{cancion.nombre_Canciones} - #{cancion.artista_Canciones} </a></li>
				</ui:repeat>
			</ul>
		</div>
		<div class="right-column">
			<div class="card">
				<h5>Reproductor de Audio</h5>
				<div class="audio-controls">
					<p:inputText id="audioUrl" styleClass="audio-url-input"
						placeholder="Inserta el enlace MP3" />
					<p:commandButton value="Reproducir" icon="pi pi-play"
						styleClass="play-button play-button-gold"
						onclick="actualizarAudio()" />

				</div>
				<div>
					<audio id="reproductorAudio" controls="controls">
						<source src="" type="audio/mp3" />
					</audio>
				</div>
			</div>
		</div>
	</div>

	<script>
		function seleccionarCancion(url) {
			document.getElementById('audioUrl').value = url;
		}

		function actualizarAudio() {
			const audioUrl = document.getElementById('audioUrl').value;
			const audioPlayer = document.getElementById('reproductorAudio');

			if (audioUrl.trim() !== '') {
				audioPlayer.src = audioUrl;
				audioPlayer.load();
				audioPlayer.play();
			} else {
				audioPlayer.pause();
			}
		}
		// Obtén el enlace del "Reproductor"
		const reproductorLink = document.querySelector('.menu-item');

		// Agrega la clase 'active' al enlace cuando estemos en la sección del reproductor
		reproductorLink.classList.add('active');
	</script>
</h:body>
</html>
