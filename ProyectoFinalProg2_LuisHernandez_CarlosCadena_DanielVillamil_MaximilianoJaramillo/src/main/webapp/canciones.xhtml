<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<title>Canción</title>
	<style>
body {
	font-family: Arial, sans-serif;
	background-image:
		url(https://img.freepik.com/vector-gratis/fondo-pentagrama-musical-brillante-notas-sonido_1017-31220.jpg);
	background-repeat: no-repeat;
	background-size: cover;
	color: white;
	margin: 0;
	padding: 0;
}

.form-container {
	width: 400px;
	margin: 50px auto;
	padding: 20px;
	border-radius: 5px;
	background-color: rgba(0, 0, 0, 0.5);
	box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
}

.form-container h2 {
	text-align: center;
	margin-bottom: 20px;
}

.custom-button {
	width: 100%;
	padding: 10px;
	border: none;
	border-radius: 4px;
	background-color: black;
	color: #c1b575;
	cursor: pointer;
	transition: background-color 0.3s;
	margin-top: 20px;
}

.custom-button:hover {
	background-color: #333;
}

.card {
	margin-top: 20px;
}

.card h5 {
	margin-bottom: 10px;
}
</style>
</h:head>

<h:body>
	<div class="form-container">
		<h2>Canciones</h2>
		<h:form id="audioForm">
			<h:panelGrid columns="2" columnClasses="label, value">
				<h:outputLabel for="nombre" value="Nombre de la canción:" />
				<p:inputText id="nombre" value="#{cancionBean.nombre_Canciones}" />

				<h:outputLabel for="artista" value="Artista de la canción:" />
				<p:inputText id="artista" value="#{cancionBean.artista_Canciones}" />

				<h:outputLabel for="genero" value="Género de la música:" />
				<p:inputText id="genero" value="#{cancionBean.genero_Musica}" />

				<h:outputLabel for="url" value="URL del audio:" />
				<p:inputText id="url" value="#{cancionBean.url_Cancion}" />
			</h:panelGrid>

			<p:commandButton value="Agregar Canción"
				action="#{cancionBean.agregarCancion}" styleClass="custom-button"
				onstart="return validateInput();" update="@form" />
		</h:form>

		<!-- Botón para regresar a reproductor.xhtml -->
		<div style="text-align: center; margin-top: 20px;">
			<p:button value="Regresar al Reproductor" outcome="reproductor.xhtml"
				styleClass="custom-button" />
		</div>
	</div>
</h:body>

</html>
