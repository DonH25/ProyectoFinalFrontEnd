<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<title>Reproductor de Archivos MP3</title>
</h:head>

<h:body>
	<h:form id="songForm" enctype="multipart/form-data">
		<p:fileUpload id="fileUpload"
			fileUploadListener="#{cancionBean.handleFileUpload}" mode="advanced"
			label="Subir Archivo MP3" auto="true"
			update="songsTable nombreCancion generoMusica" />

		<p:dataTable id="songsTable" var="cancion"
			value="#{cancionBean.listarCanciones()}">
			<p:column headerText="Nombre de la Canción">
				<h:outputText value="#{cancion.nombre_Canciones}" />
			</p:column>
			<p:column headerText="Género">
				<h:outputText value="#{cancion.genero_Musica}" />
			</p:column>
			<p:column headerText="Archivo MP3">
				<h:outputText
					value="#{cancion.archivo_MP3 != null ? 'Cargado' : 'No disponible'}" />
			</p:column>
		</p:dataTable>

		<p:inputText id="nombreCancion" value="#{cancionBean.nombre_Cancion}"
			placeholder="Nombre de la Canción" />
		<p:inputText id="generoMusica" value="#{cancionBean.genero_Musica}"
			placeholder="Género" />

		<p:commandButton value="Agregar Canción"
			action="#{cancionBean.agregarCancion()}"
			update="songsTable nombreCancion generoMusica fileUpload"
			process="@this fileUpload" />
	</h:form>
</h:body>

</html>
