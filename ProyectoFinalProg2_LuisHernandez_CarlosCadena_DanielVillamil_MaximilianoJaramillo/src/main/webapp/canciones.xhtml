<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<title>Canción</title>
	<style>
body {
	font-family: Arial, sans-serif;
	background-image:
		url(https://img.freepik.com/vector-gratis/fondo-pentagrama-musical-brillante-notas-sonido_1017-31220.jpg);
	background-repeat: no-repeat;
	background-size: cover;
	color: white;
	margin: 0;
	padding: 0;
	font-size: 16px;
}

.form-container {
	width: 400px;
	margin: 100px auto;
	/* Ajusta el margen superior e inferior para centrar verticalmente */
	padding: 20px;
	border-radius: 5px;
	background-color: rgba(0, 0, 0, 0.5);
	box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
}

.menu {
	background-color: rgba(0, 0, 0, 0.7);
	padding: 10px;
	display: flex;
	justify-content: space-between;
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	z-index: 1000;
}

.menu-item {
	color: #c1b575;
	text-decoration: none;
	margin: 0 10px;
	font-size: 16px;
}

.menu-item:hover {
	text-decoration: underline;
}

.menu-item.active {
	text-decoration: underline;
}

.container {
	display: flex;
	width: 80%;
	margin-top: 60px;
}

.form-container {
	width: 400px;
	margin: 50px auto;
	padding: 20px;
	border-radius: 5px;
	background-color: rgba(0, 0, 0, 0.5);
	box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
}

h2 {
	font-size: 24px;
	text-align: center;
	margin-bottom: 20px;
}

label {
	display: block;
	margin-bottom: 5px;
	font-size: 14px;
}

input {
	width: 100%;
	padding: 10px;
	border: none;
	border-radius: 4px;
	font-size: 14px;
}

.custom-button {
	width: 100%;
	padding: 10px;
	border: none;
	border-radius: 4px;
	background-color: black;
	color: #c1b575;
	cursor: pointer;
	transition: background-color 0.3s;
	margin-top: 20px;
}

.custom-button:hover {
	background-color: #333;
}

.card {
	margin-top: 20px;
}

.card h5 {
	margin-bottom: 10px;
}
</style>
</h:head>

<h:body>
	<div class="menu">
		<h:link value="Reproductor" outcome="reproductor.xhtml" />
		<a href="#" class="menu-item">Crear Canción</a>
	</div>

	<div class="form-container">
		<h2>Canciones</h2>
		<h:form id="audioForm">
			<h:panelGrid columns="2" columnClasses="label, value">
				<h:outputLabel for="nombre" value="Nombre de la canción:" />
				<p:inputText id="nombre" value="#{cancionBean.nombre_Canciones}" />

				<h:outputLabel for="artista" value="Artista de la canción:" />
				<p:inputText id="artista" value="#{cancionBean.artista_Canciones}" />

				<h:outputLabel for="genero" value="Género de la música:" />
				<p:inputText id="genero" value="#{cancionBean.genero_Musica}" />

				<h:outputLabel for="url" value="URL del audio:" />
				<p:inputText id="url" value="#{cancionBean.url_Cancion}" />
			</h:panelGrid>

			<p:commandButton value="Agregar Canción"
				action="#{cancionBean.agregarCancion}" styleClass="custom-button"
				onstart="return validateInput();" update="@form" />
		</h:form>

	</div>

	<script>
		// Marcar el enlace "Reproductor" como activo
		const reproductorLink = document.querySelector('.menu-item');
		reproductorLink.classList.add('active');
	</script>
</h:body>

</html>
